# Build scripts are denied by decision: both packages ship platform binaries
# as optionalDependencies and function without their postinstall scripts.
allowBuilds:
  esbuild: false
  unrs-resolver: false

# type-flag and cleye are in-house packages, so their releases skip the
# release-age soak. This lets a fix be adopted as soon as it is published.
minimumReleaseAgeExclude:
  - type-flag
  - cleye
