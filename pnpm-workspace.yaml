# Build scripts are denied by decision: both packages ship platform binaries
# as optionalDependencies and function without their postinstall scripts.
allowBuilds:
  esbuild: false
  unrs-resolver: false

# type-flag and cleye are in-house packages. type-flag releases skip the
# release-age soak so a fix can be adopted as soon as it is published; cleye
# 2.7.0 is excluded because it carries the type-flag release that handles
# reserved marker names.
minimumReleaseAgeExclude:
  - type-flag
  - cleye@2.7.0
