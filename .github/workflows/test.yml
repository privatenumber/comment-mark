name: Test
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master, next, next-major, beta, alpha]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - run: node_modules/.bin/tsx tests

      - name: Test Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - run: node_modules/.bin/tsx tests
